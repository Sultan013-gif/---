<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab2. Цифры 61</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
    Каждая цифра — это 4 столбика по 7 квадратиков.
    Столбики идут слева направо, квадратики в столбике — сверху вниз.
    .fill — закрашенный квадрат, .empty — пустой.
-->
<div class="digits">

    <!-- Цифра 6 -->
    <div class="digit">
        <div class="col">
            <div class="fill"></div><div class="fill"></div><div class="fill"></div><div class="fill"></div>
            <div class="fill"></div><div class="fill"></div><div class="fill"></div>
        </div>
        <div class="col">
            <div class="fill"></div><div class="empty"></div><div class="empty"></div><div class="fill"></div>
            <div class="empty"></div><div class="empty"></div><div class="fill"></div>
        </div>
        <div class="col">
            <div class="fill"></div><div class="empty"></div><div class="empty"></div><div class="fill"></div>
            <div class="empty"></div><div class="empty"></div><div class="fill"></div>
        </div>
        <div class="col">
            <div class="fill"></div><div class="empty"></div><div class="empty"></div><div class="fill"></div>
            <div class="fill"></div><div class="fill"></div><div class="fill"></div>
        </div>
    </div>

    <!-- Промежуток между цифрами: один пустой столбик -->
    <div class="col">
        <div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div>
        <div class="empty"></div><div class="empty"></div><div class="empty"></div>
    </div>

    <!-- Цифра 1 -->
    <div class="digit">
        <div class="col">
            <div class="empty"></div><div class="empty"></div><div class="fill"></div><div class="empty"></div>
            <div class="empty"></div><div class="empty"></div><div class="fill"></div>
        </div>
        <div class="col">
            <div class="empty"></div><div class="fill"></div><div class="empty"></div><div class="empty"></div>
            <div class="empty"></div><div class="empty"></div><div class="fill"></div>
        </div>
        <div class="col">
            <div class="fill"></div><div class="fill"></div><div class="fill"></div><div class="fill"></div>
            <div class="fill"></div><div class="fill"></div><div class="fill"></div>
        </div>
        <div class="col">
            <div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div>
            <div class="empty"></div><div class="empty"></div><div class="fill"></div>
        </div>
    </div>

</div>
</body>
</html>
