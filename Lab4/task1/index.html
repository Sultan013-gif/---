<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab4. Космический корабль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Космос: всё рисуем только блоками div и CSS, без картинок -->
<div class="space">

    <!-- звёзды -->
    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>

    <!-- планета с кольцом -->
    <div class="planet">
        <div class="ring"></div>
    </div>

    <!-- луна -->
    <div class="moon">
        <div class="crater c1"></div>
        <div class="crater c2"></div>
    </div>

    <!-- корабль -->
    <div class="ship">
        <div class="nose"></div>
        <div class="body">
            <div class="window"></div>
            <div class="stripe"></div>
            <div class="label">KC-3</div>
        </div>
        <div class="fin fin-left"></div>
        <div class="fin fin-right"></div>
        <div class="fin-middle"></div>
        <div class="nozzle"></div>
        <div class="fire fire-big"></div>
        <div class="fire fire-small"></div>
    </div>

</div>

</body>
</html>
